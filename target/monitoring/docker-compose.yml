# Supervision côté CIBLE : deux petits exportateurs (cAdvisor pour les conteneurs,
# node_exporter pour l'hôte). Prometheus et Grafana tournent sur la MACHINE DE CHARGE,
# pour ne pas perturber les mesures (voir loadgen/monitoring/).
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: bench-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "18080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: bench-node-exporter
    network_mode: host
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
